<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester Registration — RubberGuard AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <a href="/" class="brand">
      <span class="brand-icon">🍃</span>
      <div>
        <div class="brand-title">RubberGuard AI</div>
        <span class="brand-badge">Evaluation Portal</span>
      </div>
    </a>
    <div id="nav-auth-container">
      <a href="/login" class="btn btn-sm btn-outline">Sign In</a>
    </div>
  </nav>

  <main class="container">
    <div class="form-card" style="max-width: 580px;">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📝</div>
        <h2 style="color: var(--primary-dark); font-size: 1.75rem;">Register as an Evaluator</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.35rem;">
          Join our academic field evaluation. One single account works for this portal and the native Android APK.
        </p>
      </div>

      <div id="alert-box" style="display: none;"></div>

      <form id="register-form">
        <div class="grid grid-2" style="margin-top: 0; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="full-name">Full Name *</label>
            <input type="text" id="full-name" class="form-control" placeholder="e.g. Ramesh Bhat" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="username">Username *</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. ramesh_bhat" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. ramesh@example.com" required autocomplete="email">
        </div>

        <div class="grid grid-2" style="margin-top: 0; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="phone">Phone / WhatsApp</label>
            <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210">
          </div>
          <div class="form-group">
            <label class="form-label" for="location">Location / Taluk</label>
            <input type="text" id="location" class="form-control" placeholder="e.g. Sullia, DK / Udupi" value="Karnataka, India">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min. 6 characters) *</label>
          <input type="password" id="password" class="form-control" placeholder="Create a secure password" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password *</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1rem;">
          Complete Registration & Get Started
        </button>
      </form>

      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--surface-border); text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In here</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-copy">
      © 2026 RubberGuard AI Project Team • SMVITM Udupi
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = Auth.isAdmin() ? '/admin-dashboard' : '/tester-dashboard';
      }

      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert('alert-box');

        const fullName = document.getElementById('full-name').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const location = document.getElementById('location').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (password !== confirmPassword) {
          showAlert('alert-box', 'Passwords do not match. Please re-enter identical passwords.', 'error');
          return;
        }

        const submitBtn = document.getElementById('btn-submit');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Creating account...';

        const res = await apiRequest('/auth/register', 'POST', {
          fullName,
          username,
          email,
          phone,
          location,
          password,
          registeredVia: 'web'
        }, false);

        if (res.ok && res.data.success) {
          Auth.setSession(res.data.token, res.data.user);
          showAlert('alert-box', 'Registration successful! Directing to your Tester Portal...', 'success');
          setTimeout(() => {
            window.location.href = '/tester-dashboard';
          }, 800);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Complete Registration & Get Started';
          showAlert('alert-box', res.data.error || 'Failed to register account. Username or email may already be in use.', 'error');
        }
      });
    });
  </script>
</body>
</html>
